name: Join the khfagy Teams waitlist
description: Get early access to the team dashboard, with 50% off for life for the first teams.
title: "[Waitlist] "
labels: ["waitlist"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in **khfagy for Teams**.
        ⚠️ Issues on this repository are **public**. Share only what you are happy for others to see.
  - type: input
    id: company
    attributes:
      label: Company or team (optional)
    validations:
      required: false
  - type: dropdown
    id: size
    attributes:
      label: How many developers use Claude Code?
      options:
        - "1"
        - "2-5"
        - "6-20"
        - "21-100"
        - "100+"
    validations:
      required: true
  - type: checkboxes
    id: wants
    attributes:
      label: What would you pay for?
      options:
        - label: Web dashboard for the team
        - label: Central audit log
        - label: Cost per developer
        - label: Edit the policy from the web
        - label: Single sign-on (SSO)
  - type: dropdown
    id: price
    attributes:
      label: Is $12 per developer per month OK?
      options:
        - "Yes"
        - Only with a discount
        - Too expensive
        - Not sure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
    validations:
      required: false
