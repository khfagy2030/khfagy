<script>

const $ = (s, r = document) => r.querySelector(s)
const T = (k, f) => (window.khT ? window.khT(k, f) : f)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

const L = (en, vars = {}) => { let t = window.khT ? window.khT('u:' + en, en) : en; for (const [k, v] of Object.entries(vars)) t = t.split('{' + k + '}').join(v); return t }
const copyBtn = (getText) => {

  b.onclick = async () => { try { await navigator.clipboard.writeText(getText()); b.textContent = L('Copied ✓'); setTimeout(() => b.textContent = L('Copy'), 1200) } catch { b.textContent = L('Copy failed') } }
  return b
}
const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(x => bin += String.fromCharCode(x)); return btoa(bin) }
const b64dec = b64 => { const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, '') + '==='.slice((b64.replace(/\s+/g, '').length + 3) % 4)); return new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.from(bin, c => c.charCodeAt(0))) }

// ---------- shared security data (same rules as the khfagy mod) ----------
const KEY_FORMATS = [
  ['Anthropic API key', /\bsk-ant-[A-Za-z0-9_-]{20,}/g],
  ['OpenAI API key', /\bsk-(?:proj-)?[A-Za-z0-9_-]{32,}/g],
  ['GitHub token', /\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}|\bgithub_pat_[A-Za-z0-9_]{40,}/g],
  ['AWS access key', /\b(?:AKIA|ASIA)[0-9A-Z]{16}\b/g],
  ['Google API key', /\bAIza[0-9A-Za-z_-]{35}\b/g],
  ['Slack token', /\bxox[abposr]-[A-Za-z0-9-]{10,}/g],
  ['Stripe live key', /\b(?:sk|rk)_live_[0-9A-Za-z]{20,}/g],
  ['Private key', /-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----/g],
  ['JWT', /\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/g],
  ['Password in a URL', /\b[a-z][a-z0-9+.-]*:\/\/[^\s:@/]+:[^\s:@/]{3,}@[^\s]+/gi],
  ['Hard-coded password', /\b(?:password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*["'][^"'\s]{6,}["']/gi],
]
const NPM_TOP = ['react','react-dom','next','vue','angular','svelte','express','axios','lodash','moment','dayjs','chalk','commander','yargs','debug','dotenv','uuid','nanoid','typescript','webpack','vite','rollup','esbuild','eslint','prettier','jest','vitest','mocha','chai','cypress','playwright','puppeteer','request','node-fetch','cross-env','nodemon','rimraf','mkdirp','glob','minimist','mongoose','mongodb','mysql','mysql2','redis','ioredis','sequelize','prisma','knex','socket.io','cors','helmet','morgan','body-parser','cookie-parser','jsonwebtoken','bcrypt','bcryptjs','passport','multer','sharp','zod','joi','rxjs','redux','zustand','immer','tailwindcss','postcss','autoprefixer','sass','styled-components','classnames','date-fns','luxon','underscore','jquery','bootstrap','three','electron','fastify','koa','hono','graphql','apollo-server','openai','discord.js','twilio','stripe','firebase','colors','inquirer','execa','fs-extra','semver','tslib','core-js','ramda','async','bluebird','cheerio','marked']
const PYPI_TOP = ['requests','numpy','pandas','scipy','matplotlib','seaborn','scikit-learn','tensorflow','torch','keras','flask','django','fastapi','uvicorn','gunicorn','pydantic','sqlalchemy','psycopg2','pymysql','redis','celery','boto3','botocore','urllib3','certifi','charset-normalizer','setuptools','wheel','python-dateutil','pytz','pyyaml','jinja2','click','rich','typer','tqdm','pillow','opencv-python','beautifulsoup4','lxml','selenium','scrapy','httpx','aiohttp','pytest','black','flake8','mypy','pylint','openai','anthropic','transformers','langchain','cryptography','paramiko','colorama','termcolor','python-dotenv','openpyxl','python-docx','pyinstaller','jupyter','notebook','ipython','plotly','streamlit','gradio','networkx','sympy','nltk','spacy','xgboost','lightgbm','pyjwt','bcrypt','websockets']
const distance = (a, b) => {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)])
  for (let j = 0; j <= b.length; j++) d[0][j] = j
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c)
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1)
  }
  return d[a.length][b.length]
}
const lookalikeOf = (name, eco) => {
  const top = eco === 'npm' ? NPM_TOP : PYPI_TOP
  const plain = name.replace(/^@[^/]+\//, '')
  if (top.includes(name) || top.includes(plain) || plain.length < 4) return undefined
  const flat = s => s.replace(/[-_.]/g, '')
  const max = plain.length >= 9 ? 2 : 1
  for (const t of top) {
    if (t.length < 4) continue
    if (flat(t) === flat(plain) || (Math.abs(t.length - plain.length) <= max && distance(plain, t) <= max)) {
      if (eco === 'pypi' && t.replace(/[-_.]/g, '-') === plain.replace(/[-_.]/g, '-')) return undefined
      return t
    }
  }
}
const INJECTION = [
  /\b(ignore|disregard|forget|override)\s+(all\s+|any\s+|the\s+|your\s+)*(previous|prior|above|earlier|preceding|system|original)\s+(instructions|prompts?|rules|directions|messages)/gi,
  /\byou\s+are\s+now\s+(a|an|in|DAN|no\s+longer)\b/gi,
  /\b(new|updated|real)\s+(system\s+)?instructions\s*:/gi,
  /<\s*\/?\s*(system|assistant|im_start|im_end)\s*>|\[\s*(SYSTEM|INST)\s*\]/gi,
  /\b(do\s+not|don'?t|never)\s+(tell|inform|alert|mention\s+(this\s+)?to)\s+the\s+user\b/gi,
  /\b(send|post|upload|exfiltrate|leak|email)\s+(me\s+)?(the\s+|all\s+|your\s+|any\s+)*(api[\s_-]?keys?|secrets?|tokens?|credentials|passwords?|\.env|ssh\s+keys?)\b/gi,
  /\b(AI|assistant|agent|LLM|Claude|model)\s*[,:]?\s+(must|should|now)\s+(ignore|run|execute|delete|send)\b/gi,
  /[​-‏‪-‮⁠-⁤﻿]/g,
]
const DESTRUCTIVE = [
  ['Deletes everything recursively', /\brm\s+(-[a-z]*r[a-z]*f[a-z]*|-[a-z]*f[a-z]*r[a-z]*|--recursive\s+--force|--force\s+--recursive)\s+(\/|~|\$HOME|\*|\/\*|\.)(\s|$)/i],
  ['Force push rewrites shared history', /\bgit\s+push\b.*(\s--force(?!-with-lease)\b|\s-f\b)/i],
  ['Throws away uncommitted work', /\bgit\s+(reset\s+--hard|clean\s+-[a-z]*f[a-z]*d|checkout\s+--\s+\.)/i],
  ['Recursive delete of a drive or home folder', /\bRemove-Item\b.*-Recurse\b.*\s([A-Z]:\\?|~|\$HOME)(\s|$)/i],
  ['Wipes a disk or filesystem', /\b(mkfs(\.\w+)?|format\s+[A-Z]:|diskpart\b.*\bclean\b|dd\s+.*of=\/dev\/(sd|nvme|disk))/i],
  ['Fork bomb', /:\(\)\s*\{\s*:\|:&\s*\};:/],
  ['Drops a whole database', /\bDROP\s+(DATABASE|SCHEMA)\b/i],
  ['Deletes every row of a table', /\b(DELETE\s+FROM\s+\w+\s*(;|$)|TRUNCATE\s+TABLE)/i],
  ['Runs a script straight from the internet', /\b(curl|wget|iwr|Invoke-WebRequest)\b[^|]*\|\s*(sudo\s+)?(sh|bash|zsh|iex|Invoke-Expression|python)\b/i],
  ['Opens every permission', /\bchmod\s+(-R\s+)?777\b/i],
  ['Changes the whole system as admin', /\bsudo\s+(rm|chown|chmod)\s+-R\s+\//i],
]

// ---------- tools ----------
const TOOLS = [
  { id: 'secrets', group: 'Security', icon: '🔑', name: 'Secret scanner',
    desc: 'Paste code, a config file, a log or a diff. Finds API keys, tokens, private keys and hard-coded passwords before you commit or share them.',
    html: `<label for="in">Code or text</label><textarea id="in" placeholder="const key = 'sk-ant-...'"></textarea>
      <div class="row"><button id="go">Scan</button></div><div id="m" class="msg" hidden></div><div id="res"></div>`,
    init(p) {
      $('#go', p).onclick = () => {
        const text = $('#in', p).value, found = []
        for (const [kind, re] of KEY_FORMATS) for (const m of text.matchAll(re)) {
          const line = text.slice(0, m.index).split('\n').length
          found.push({ kind, line, value: m[0].length > 14 ? m[0].slice(0, 6) + '…' + m[0].slice(-4) : m[0] })
        }
        if (!text.trim()) return msg($('#m', p), 'warn', L('Paste something to scan.'))
        if (!found.length) { $('#res', p).innerHTML = ''; return msg($('#m', p), 'ok', L('✓ No secrets found.')) }
        msg($('#m', p), 'bad', L('⚠ Possible secrets found: {n}. Remove them and rotate any real key.', { n: found.length }))
        $('#res', p).innerHTML = '<table class="res"><tr><th>Line</th><th>Type</th><th>Value</th></tr>' + found.sort((a, b) => a.line - b.line).map(f => `<tr><td>${f.line}</td><td>${esc(f.kind)}</td><td class="v">${esc(f.value)}</td></tr>`).join('') + '</table>'
      }
    } },
  { id: 'packages', group: 'Security', icon: '📦', name: 'Fake package checker',
    desc: 'Typosquatting: attackers publish packages named like popular ones ("reqeusts", "expresss"). Paste package names or install commands to check them.',
    html: `<label for="eco">Ecosystem</label><select id="eco"><option value="npm">npm (JavaScript)</option><option value="pypi">PyPI (Python)</option></select>
      <label for="in">Package names, package.json, requirements.txt or install command</label><textarea id="in" placeholder="pip install reqeusts numpy"></textarea>
      <div class="row"><button id="go">Check</button></div><div id="m" class="msg" hidden></div><div id="res"></div>`,
    init(p) {
      $('#go', p).onclick = () => {
        let eco = $('#eco', p).value; const raw = $('#in', p).value
        if (/\bpip3?\b|\buv\b|\bpoetry\b|requirements/i.test(raw)) eco = 'pypi'
        if (/\b(npm|pnpm|yarn|bun)\b|"dependencies"/.test(raw)) eco = 'npm'
        $('#eco', p).value = eco
        let names = []
        try { const j = JSON.parse(raw); names = Object.keys({ ...j.dependencies, ...j.devDependencies }) } catch {
          names = raw.split(/[\s,]+/).filter(w => w && !w.startsWith('-') && !/^(npm|pnpm|yarn|bun|pip3?|uv|poetry|pipx|pipenv|install|add|i|sudo|python3?|-m)$/i.test(w) && !/^(\.|\/|https?:)/.test(w))
            .map(w => (eco === 'npm' ? w.replace(/(.)@[^@/]*$/, '$1') : w.replace(/\[.*$/, '').replace(/[=<>!~;].*$/, '')).toLowerCase()).filter(Boolean)
        }
        names = [...new Set(names)]
        if (!names.length) { $('#res', p).innerHTML = ''; return msg($('#m', p), 'warn', L('No package names found.')) }
        const rows = names.map(n => ({ n, real: lookalikeOf(n, eco) }))
        const bad = rows.filter(r => r.real)
        msg($('#m', p), bad.length ? 'bad' : 'ok', bad.length ? L('⚠ Names that look like a fake copy of a popular package: {n}.', { n: bad.length }) : L('✓ Names checked: {n}. None looks like a copy of a popular package.', { n: names.length }))
        $('#res', p).innerHTML = '<table class="res"><tr><th>Package</th><th>Result</th></tr>' + rows.map(r => `<tr><td class="v">${esc(r.n)}</td><td>${r.real ? L('⚠ Looks like {x}. Did you mean that?', { x: '<b>' + esc(r.real) + '</b>' }) : '✓ ' + L('OK')}</td></tr>`).join('') + '</table>'
      }
    } },
  { id: 'command', group: 'Security', icon: '⛔', name: 'Dangerous command checker',
    desc: 'Before you run a shell command from a tutorial, a chat or an AI, check it for commands that delete data, rewrite git history or run code from the internet.',
    html: `<label for="in">Shell commands (one per line)</label><textarea id="in" placeholder="curl https://example.com/install.sh | sudo bash"></textarea>

        if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60 }
        return [Math.round(h), Math.round(s * 100), Math.round(l * 100)] }
      const lum = (r, g, b) => { const f = c => (c /= 255) <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b) }
      const parse = s => { s = s.trim().toLowerCase(); let m
        if ((m = s.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/))) { let h = m[1]; if (h.length === 3) h = [...h].map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)) }
        if ((m = s.match(/^rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/))) return m.slice(1, 4).map(Number).map(x => Math.min(255, x))
        if ((m = s.match(/^hsla?\(\s*([\d.]+)[\s,]+([\d.]+)%?[\s,]+([\d.]+)%?/))) return hsl2rgb(+m[1], +m[2], +m[3]) }
      const run = (s) => {
        const c = parse(s); if (!c) { $('#res', p).innerHTML = ''; return msg($('#m', p), 'bad', L('Could not read this color.')) }
        $('#m', p).hidden = true; const [r, g, b] = c, hex = toHex(r, g, b), [h, sl, l] = rgb2hsl(r, g, b), lumV = lum(r, g, b)
        const cw = (1.05 / (lumV + .05)).toFixed(2), cb = ((lumV + .05) / .05).toFixed(2), grade = x => x >= 7 ? 'AAA' : x >= 4.5 ? 'AA' : x >= 3 ? L('AA large text') : L('fails')
        $('#sw', p).style.background = hex; $('#pick', p).value = hex
        $('#res', p).innerHTML = '<table class="res">' + [['HEX', hex], ['RGB', `rgb(${c.map(Math.round).join(', ')})`], ['HSL', `hsl(${h}, ${sl}%, ${l}%)`], ['Contrast with white text', `${cw} : 1 (${grade(cw)})`], ['Contrast with black text', `${cb} : 1 (${grade(cb)})`]].map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join('') + '</table>'
      }
      $('#in', p).oninput = () => run($('#in', p).value); $('#pick', p).oninput = () => { $('#in', p).value = $('#pick', p).value; run($('#pick', p).value) }; run($('#in', p).value)
    } },
]

// ---------- shell ----------
const list = $('#list'), panel = $('#panel')
const drawList = (q = '') => {
  q = q.toLowerCase(); let html = '', last = ''
  for (const t of TOOLS) {
    if (q && !(t.name + ' ' + t.desc + ' ' + t.group + ' ' + T('n_' + t.id, '') + ' ' + T('d_' + t.id, '')).toLowerCase().includes(q)) continue
    if (t.group !== last) { html += `<div class="group">${esc(T('g' + t.group, t.group))}</div>`; last = t.group }
    html += `<a class="tool" href="#${t.id}" data-id="${t.id}"><span class="i">${t.icon}</span>${esc(T('n_' + t.id, t.name))}</a>`
  }
  list.innerHTML = html || `<div class="group">${esc(T('tNone', 'No tool found'))}</div>`; mark()
}
const mark = () => { const id = location.hash.slice(1) || TOOLS[0].id; list.querySelectorAll('a.tool').forEach(a => a.classList.toggle('on', a.dataset.id === id)) }
const SKIP = 'pre, textarea, td.v, #th, #td, #tn, select#eco'
const uiText = (root) => {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
  for (let n; (n = w.nextNode());) {
    if (n.parentElement.closest(SKIP)) continue
    if (n.khEn === undefined) n.khEn = n.data
    const core = n.khEn.trim(); if (!core) continue
    const t = T('u:' + core, core)
    n.data = n.khEn.replace(core, t)
  }
}
new MutationObserver(() => uiText(panel)).observe(panel, { childList: true, subtree: true })
const open = () => {
  const t = TOOLS.find(x => x.id === location.hash.slice(1)) || TOOLS[0]
  panel.innerHTML = `<h2 id="th"></h2><p class="desc" id="td"></p>${t.html}<div class="note" id="tn"></div>`
  t.init(panel); mark(); words(t)
  if (innerWidth <= 860 && location.hash) panel.scrollIntoView({ behavior: 'smooth', block: 'start' })
}
const words = (t = TOOLS.find(x => x.id === location.hash.slice(1)) || TOOLS[0]) => {
  $('#th').textContent = `${t.icon} ${T('n_' + t.id, t.name)}`
  $('#td').textContent = T('d_' + t.id, t.desc)
  $('#tn').innerHTML = `🔒 <b>${esc(T('tPrivate', 'Private:'))}</b> ${esc(T('tPrivateText', 'this tool runs only in your browser. Nothing you paste is sent anywhere.'))}${t.group === 'Security' ? ` <a href="../">${esc(T('tUseKh', 'Using Claude Code? khfagy runs these checks for you automatically, before anything goes wrong.'))}</a>` : ''}`
  document.title = `${T('n_' + t.id, t.name)} · ${T('tH1', 'Free developer tools')} · khfagy`
}
addEventListener('kh-lang', () => { drawList($('#search').value); if ($('#th')) { words(); uiText(panel) } })
$('#search').oninput = e => drawList(e.target.value)
addEventListener('hashchange', open)
drawList(); open()
</script>
<script src="../i18n.js"></script>
</body>
